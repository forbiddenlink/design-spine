name: Action e2e

# Runs this repo's action.yml against the demo site on a real runner. The first run on a PR
# creates the sticky comment; every later push must edit it, so the count stays at one.
on:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-e2e.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # Fork PRs get a read-only token, so the comment checks below cannot pass there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Start demo site
        run: |
          bun fixtures/demo-site/serve.ts 4010 &
          for _ in $(seq 1 30); do curl -sf http://localhost:4010/ >/dev/null && exit 0; sleep 1; done
          echo "demo site did not start" >&2
          exit 1
      - name: Run the action
        uses: ./
        with:
          working-directory: fixtures/demo-site
          comment: "true"
      - name: Check summary, report and sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -s fixtures/demo-site/design-spine-report.html || { echo "report missing" >&2; exit 1; }
          ls fixtures/demo-site/.design-spine/runs/*/run.json >/dev/null
          [ -n "$PR_NUMBER" ] || exit 0
          count=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- design-spine -->")))] | length')
          echo "design-spine comments by github-actions[bot]: $count"
          [ "$count" = "1" ] || { echo "expected exactly one sticky comment, got $count" >&2; exit 1; }
