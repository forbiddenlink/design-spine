# TEMPORARY: regenerates tests/visual-baselines in the pinned Docker image for PR #33 and commits
# them to this branch for human inspection. Remove before merging.
name: Regenerate visual baselines (temporary)

on:
  push:
    branches: [improve/review-workflow-and-diff]
    paths: [.github/workflows/regenerate-visual-baselines.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual:update
      - run: pnpm test:visual
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual-baselines
          git diff --cached --quiet && exit 0
          git commit -m "test: regenerate visual baselines in the pinned image for intended UI changes"
          git push
