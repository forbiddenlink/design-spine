<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Spine review</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4; --surface: #ffffff; --ink: #1b1b1a; --muted: #6a6a66; --line: #dcdcd7;
  --accent: #2f5fd0; --ok: #1f7a3d; --ok-bg: #e2f3e8; --bad: #b3261e; --bad-bg: #fbe4e2;
  --warn: #8a5a00; --warn-bg: #fdf0d2; --focus: #2f5fd0; --on-strong: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --surface: #1c1c1a; --ink: #ecece8; --muted: #9a9a94; --line: #34342f;
    --accent: #7fa3f5; --ok: #6fd08f; --ok-bg: #173522; --bad: #ff8f86; --bad-bg: #3d1d1a;
    --warn: #f0c35a; --warn-bg: #3a2f10; --focus: #7fa3f5; --on-strong: #111;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.stats { color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.filters { display: flex; gap: 8px; margin-left: auto; }
.pill { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 4px 12px; font: inherit; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 8px 24px 80px; max-width: 1800px; margin: 0 auto; }
.route { margin-top: 28px; }
.route > h2 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
.route > h2 code { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
.state { margin: 14px 0 22px; }
.state > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  margin: 0 0 8px; font-weight: 600; }
.row { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .row { grid-template-columns: minmax(0, 1fr); } header, main { padding-left: 14px; padding-right: 14px; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  display: flex; flex-direction: column; gap: 8px; outline: none; }
.tile.focus { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 35%, transparent); }
.tile.approved { border-left: 4px solid var(--ok); }
.tile.rejected { border-left: 4px solid var(--bad); }
.tile .head { display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted); font-weight: 600; }
.thumb { border: 1px solid var(--line); border-radius: 6px; overflow: auto; max-height: 340px; background: #8883; }
.thumb img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: var(--bad-bg); color: var(--bad); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.crit { font-size: 12px; border-top: 1px dashed var(--line); padding-top: 6px; }
.crit ul { margin: 4px 0 0; padding-left: 16px; }
.crit .sev { font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: .05em; color: var(--muted); }
.actions { display: flex; gap: 6px; }
.actions button { flex: 1; font: inherit; font-weight: 600; padding: 6px 0; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.actions .approve[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--on-strong); }
.actions .reject[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--on-strong); }
textarea { width: 100%; resize: vertical; min-height: 34px; font: inherit; font-size: 12px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.empty { color: var(--muted); padding: 60px 0; text-align: center; }
.keys { color: var(--muted); font-size: 12px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, Menlo, monospace; }
#lightbox { position: fixed; inset: 0; background: #000d; display: none; overflow: auto; z-index: 10; padding: 24px; }
#lightbox.open { display: block; }
#lightbox img { display: block; margin: 0 auto; max-width: none; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>Design Spine <span id="runid" class="keys"></span></h1>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <button class="pill" id="f-flagged" aria-pressed="false">Only flagged</button>
    <button class="pill" id="f-unrev" aria-pressed="false">Only unreviewed</button>
  </div>
  <div class="keys"><kbd>j</kbd>/<kbd>k</kbd> move <kbd>a</kbd> approve <kbd>r</kbd> reject <kbd>Enter</kbd> zoom</div>
</header>
<main id="main"></main>
<div id="lightbox" role="dialog" aria-label="Full size screenshot"><img alt=""></div>
<script>
const state = { run: null, review: {}, critique: {}, onlyFlagged: false, onlyUnreviewed: false, focus: null };
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ORDER = [[390, 'light'], [390, 'dark'], [1280, 'light'], [1280, 'dark']];

function flags(t) {
  const f = [];
  if (t.error) f.push(['error: ' + t.error, false]);
  if (t.status === 0 && !t.error) f.push(['no response', false]);
  if (t.status >= 400) f.push(['HTTP ' + t.status, false]);
  if (t.overflowX) f.push(['overflow-x', false]);
  if (t.blankRegions.count) f.push([t.blankRegions.count + ' blank region' + (t.blankRegions.count > 1 ? 's' : ''), false]);
  if (t.brokenImages.length) f.push([t.brokenImages.length + ' broken img', false]);
  if (t.consoleErrors.length) f.push([t.consoleErrors.length + ' console err', false]);
  if (t.pageErrors.length) f.push([t.pageErrors.length + ' page err', false]);
  return f;
}
const isFlagged = (t) => flags(t).length > 0;
const decision = (t) => (state.review[t.id] || {}).decision || null;

async function load() {
  const r = await (await fetch('/api/run')).json();
  state.run = r.run; state.review = (r.review || {}).tiles || {}; state.critique = (r.critique || {}).tiles || {};
  $('#runid').textContent = r.run.id;
  render();
}

function visibleTiles() {
  return state.run.tiles.filter((t) => (!state.onlyFlagged || isFlagged(t)) && (!state.onlyUnreviewed || !decision(t)));
}

function renderStats() {
  const tiles = state.run.tiles;
  const n = (fn) => tiles.filter(fn).length;
  const s = $('#stats'); s.replaceChildren();
  for (const [label, v] of [['tiles', tiles.length], ['flagged', n(isFlagged)], ['approved', n((t) => decision(t) === 'approve')],
    ['rejected', n((t) => decision(t) === 'reject')], ['unreviewed', n((t) => !decision(t))]]) {
    const span = el('span', null, label + ' '); span.append(el('b', null, String(v))); s.append(span);
  }
}

function renderTile(t) {
  const d = decision(t);
  const card = el('div', 'tile' + (d === 'approve' ? ' approved' : d === 'reject' ? ' rejected' : '') + (state.focus === t.id ? ' focus' : ''));
  card.dataset.id = t.id; card.tabIndex = 0;
  const head = el('div', 'head'); head.append(el('span', null, t.viewport + 'px ' + t.theme), el('span', null, t.status ? 'HTTP ' + t.status : ''));
  const thumb = el('div', 'thumb');
  if (!t.error) {
    const img = el('img'); img.loading = 'lazy'; img.src = '/img/' + encodeURIComponent(t.file); img.alt = t.id;
    img.addEventListener('click', () => openBox(t)); thumb.append(img);
  } else thumb.append(el('div', 'empty', 'no screenshot'));
  const badges = el('div', 'badges');
  const fl = flags(t);
  if (!fl.length) badges.append(el('span', 'badge ok', 'clean'));
  for (const [text] of fl) badges.append(el('span', 'badge', text));
  if (t.textClipped.length) badges.append(el('span', 'badge warn', t.textClipped.length + ' text clipped'));
  const detail = [...t.consoleErrors, ...t.pageErrors, ...t.brokenImages];
  if (detail.length) badges.title = detail.join('\n');
  card.append(head, thumb, badges);
  const c = state.critique[t.id];
  if (c) {
    const box = el('div', 'crit');
    box.append(el('b', null, c.verdict === 'pass' ? 'Critique: pass' : c.verdict === 'fix' ? 'Critique: fix' : 'Critique: error'));
    if (c.error) box.append(el('div', null, c.error));
    if (c.issues && c.issues.length) {
      const ul = el('ul');
      for (const i of c.issues) { const li = el('li'); li.append(el('span', 'sev', i.severity + ' '), document.createTextNode(i.what + (i.where ? ' (' + i.where + ')' : ''))); ul.append(li); }
      box.append(ul);
    }
    card.append(box);
  }
  const actions = el('div', 'actions');
  const ap = el('button', 'approve', 'Approve'); ap.setAttribute('aria-pressed', String(d === 'approve'));
  const rj = el('button', 'reject', 'Reject'); rj.setAttribute('aria-pressed', String(d === 'reject'));
  ap.addEventListener('click', () => setDecision(t, 'approve')); rj.addEventListener('click', () => setDecision(t, 'reject'));
  actions.append(ap, rj);
  const note = el('textarea'); note.placeholder = 'Note'; note.value = (state.review[t.id] || {}).note || '';
  note.addEventListener('change', () => save(t, { note: note.value }));
  note.addEventListener('keydown', (e) => e.stopPropagation());
  card.append(actions, note);
  card.addEventListener('focusin', () => { state.focus = t.id; document.querySelectorAll('.tile.focus').forEach((x) => x.classList.remove('focus')); card.classList.add('focus'); });
  return card;
}

function render() {
  renderStats();
  const main = $('#main'); main.replaceChildren();
  const vis = visibleTiles();
  if (!vis.length) { main.append(el('div', 'empty', 'No tiles match the current filters.')); return; }
  const byRoute = new Map();
  for (const t of vis) {
    if (!byRoute.has(t.route)) byRoute.set(t.route, new Map());
    const states = byRoute.get(t.route);
    if (!states.has(t.state)) states.set(t.state, []);
    states.get(t.state).push(t);
  }
  for (const [route, states] of byRoute) {
    const sec = el('section', 'route'); const h = el('h2'); h.append(el('code', null, route)); sec.append(h);
    for (const [name, tiles] of states) {
      const st = el('div', 'state'); st.append(el('h3', null, name));
      const row = el('div', 'row');
      tiles.sort((a, b) => ORDER.findIndex(([v, th]) => v === a.viewport && th === a.theme) - ORDER.findIndex(([v, th]) => v === b.viewport && th === b.theme));
      for (const t of tiles) row.append(renderTile(t));
      st.append(row); sec.append(st);
    }
    main.append(sec);
  }
}

async function save(t, patch) {
  const res = await fetch('/api/review', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tileId: t.id, ...patch }) });
  if (res.ok) state.review[t.id] = await res.json();
}
async function setDecision(t, d) {
  const next = decision(t) === d ? null : d;
  await save(t, { decision: next });
  const keep = state.focus; render(); focusTile(keep);
}
function focusTile(id) {
  state.focus = id;
  const n = id && document.querySelector('.tile[data-id="' + CSS.escape(id) + '"]');
  if (n) { n.focus({ preventScroll: true }); n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function move(dir) {
  const vis = [...document.querySelectorAll('.tile')];
  if (!vis.length) return;
  const i = vis.findIndex((n) => n.dataset.id === state.focus);
  const j = i < 0 ? (dir > 0 ? 0 : vis.length - 1) : Math.min(vis.length - 1, Math.max(0, i + dir));
  focusTile(vis[j].dataset.id);
}
function openBox(t) { const lb = $('#lightbox'); lb.querySelector('img').src = '/img/' + encodeURIComponent(t.file); lb.classList.add('open'); }
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('open'));
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { $('#lightbox').classList.remove('open'); return; }
  const t = state.run && state.run.tiles.find((x) => x.id === state.focus);
  if (e.key === 'j') move(1);
  else if (e.key === 'k') move(-1);
  else if (e.key === 'a' && t) setDecision(t, 'approve');
  else if (e.key === 'r' && t) setDecision(t, 'reject');
  else if (e.key === 'Enter' && t && e.target.tagName !== 'BUTTON') openBox(t);
});
for (const [id, key] of [['#f-flagged', 'onlyFlagged'], ['#f-unrev', 'onlyUnreviewed']]) {
  $(id).addEventListener('click', (e) => { state[key] = !state[key]; e.currentTarget.setAttribute('aria-pressed', String(state[key])); render(); });
}
load();
</script>
</body>
</html>
