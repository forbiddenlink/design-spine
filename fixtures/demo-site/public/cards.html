<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cards</title><style>
:root{--bg:#fff;--ink:#16181d;--card:#eef1f6;--line:#cfd6e2}
[data-theme=dark]{--bg:#12141a;--ink:#eceef3;--card:#1f232d;--line:#363c4a}
